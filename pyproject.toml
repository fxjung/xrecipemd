[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "xrecipemd"
dynamic = ["version"]
authors = [
    { name = "Felix Jung", email = "felix.jung@tu-dresden.de" },
]
license = "LGPL-3.0"
description = """Extended RecipeMD"""
keywords = ["utilities", "python", "science"]
readme = "README.md"
requires-python=">=3.8"
classifiers = [
    "Natural Language :: English",
    "Programming Language :: Python :: 3.10",
    "Topic :: Cookery",
]
dependencies = [
    'dataclasses-json>=0.5.2,<0.6.0',
    'yarl>=1.3.0,<2.0.0',
    'argcomplete>=1.10.0,<2.0.0',
    'pyparsing~=2.4.2',
    'markdown-it-py>=2.1.0,<3.0.0',
    'typing_extensions>=4.3.0,<5.0.0',
    'python-frontmatter',
    'ruamel.yaml'
]

[project.optional-dependencies]
dev = [
    "black==25.1.0",
    "pytest",
    "pytest-cov",  # necessary?
    "jsonschema",  # necessary?
    ]

# TODO check versions
docs = [
    'Sphinx==5.1.1',
    'm2r2==0.3.3',
    'sphinxcontrib.fulltoc==1.2.0',
    'sphinxcontrib.autoprogram==0.1.7',
    'sphinx_autodoc_typehints==1.19.2',
    'sphinxcontrib.apidoc==0.3.0',
    'sphinx-autobuild==2021.3.14'
]

[project.urls]
"Repository" = "https://github.com/fxjung/xrecipemd"

[project.scripts]
xrmd = "xrecipemd.cli.main:main"
xrmd-find = "xrecipemd.cli.find:main"

[tool.setuptools]
zip-safe = false
include-package-data = false
py-modules = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.mplstyle"]

[tool.setuptools_scm]
tag_regex = "^v(?P<version>.*)$"
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"  # or "dirty-tag" for local dev

[tool.black]
line-length = 88
target-version = ['py313']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | _deps
  | buck-out
  | build
  | dist
  | googletest
)/
'''

# NOTE: you have to use single-quoted strings in TOML for regular expressions.
# It's the equivalent of r-strings in Python.  Multiline strings are treated as
# verbose regular expressions by Black.  Use [ ] to denote a significant space
# character.
